# render.yaml — Frontend (Next.js)
services:
  - type: web
    name: quirra-web
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /          
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE
        value: https://quirra-api.onrender.com
      - key: NEXT_PUBLIC_CHROME_WEBSTORE_URL
        value: ""
      - key: NEXT_PUBLIC_EDGE_ADDONS_URL
        value: ""
