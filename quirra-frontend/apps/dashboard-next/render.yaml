services:
  - type: web
    name: quirra-api
    env: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput || true
    startCommand: bash -lc "python manage.py migrate --noinput && gunicorn quirra.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: QUIRRA_USER_SALT
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: quirra-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"

  - type: web
    name: quirra-frontend
    env: node
    rootDir: quirra-frontend/apps/dashboard-next
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE
        value: "https://quirra-api.onrender.com/api"
      # optional
      # - key: NEXT_PUBLIC_API_SECRET
      #   value: "<same secret the backend expects>"
      # - key: NEXT_PUBLIC_CHROME_WEBSTORE_URL
      #   value: "https://chromewebstore.google.com/detail/<id>"

databases:
  - name: quirra-db
    plan: free
